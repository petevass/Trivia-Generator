<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Play')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<!-- Static screens: loading / error / results -->
<div id="static-screens" class="flex-1 max-w-xl mx-auto px-4 mt-10 mb-16">

    <!-- Loading -->
    <div id="loading-screen" class="text-center py-20">
        <div class="w-12 h-12 rounded-full animate-spin mx-auto mb-4" style="border:4px solid #4c2398;border-top-color:#a78bfa"></div>
        <p class="font-semibold" style="color:#c4b5fd">Loading questions...</p>
    </div>

    <!-- Error -->
    <div id="error-screen" class="d-none text-center py-20">
        <i class="bi bi-exclamation-triangle-fill text-red-400 block mb-4" style="font-size:3rem"></i>
        <p id="error-msg" class="font-semibold mb-6" style="color:#c4b5fd">Something went wrong.</p>
        <a href="/pages/session/setup"
           class="inline-flex items-center gap-2 font-black px-6 py-3 rounded-xl transition-all"
           style="background:#fff;color:#2d1265">
            Start New Session
        </a>
    </div>

    <!-- Results -->
    <div id="results-screen" class="d-none">
        <div class="rounded-3xl p-10 text-center mt-6 shadow-2xl border-2"
             style="background:linear-gradient(135deg,#3a1578 0%,#46178F 100%);border-color:rgba(255,255,255,0.2)">
            <i class="bi bi-trophy-fill block mb-4 text-yellow-300" style="font-size:3.5rem"></i>
            <div class="text-7xl font-black mb-1 text-white" id="results-correct">0</div>
            <p class="font-semibold mb-1" style="color:#c4b5fd">
                correct out of <strong class="text-white" id="results-total">0</strong>
            </p>
            <p class="mb-4">
                <span class="text-3xl font-black text-white" id="results-accuracy">0%</span>
                <span class="font-semibold" style="color:#c4b5fd"> accuracy</span>
            </p>
            <p id="results-message" class="text-sm font-semibold mb-7" style="color:#c4b5fd"></p>
            <div class="flex flex-wrap justify-center gap-3">
                <a href="/pages/session/setup"
                   class="inline-flex items-center gap-2 font-black px-6 py-3 rounded-xl transition-all shadow-lg hover:-translate-y-0.5"
                   style="background:#fff;color:#2d1265">
                    <i class="bi bi-arrow-repeat"></i>Play Again
                </a>
                <a href="/"
                   class="inline-flex items-center gap-2 border-2 border-white/50 text-white hover:bg-white/15 font-bold px-6 py-3 rounded-xl transition-all">
                    <i class="bi bi-house"></i>Home
                </a>
                <a href="/pages/leaderboard"
                   class="inline-flex items-center gap-2 border-2 font-bold px-6 py-3 rounded-xl transition-all"
                   style="border-color:#6c3dc5;color:#c4b5fd"
                   onmouseover="this.style.background='rgba(108,61,197,0.3)'" onmouseout="this.style.background=''">
                    <i class="bi bi-trophy"></i>Leaderboard
                </a>
            </div>
        </div>
    </div>

</div>

<!-- ══ KAHOOT GAME SCREEN ══ -->
<div id="game-screen" class="d-none kahoot-game">

    <!-- Top bar: question counter | score | end -->
    <div class="kahoot-header">
        <div class="kahoot-q-badge">
            <i class="bi bi-list-ol mr-1"></i>Q <span id="progress-text">1 / 10</span>
        </div>
        <div class="kahoot-score-badge">
            <i class="bi bi-lightning-charge-fill" style="color:#FFA602"></i>
            <span id="current-score">0</span>
        </div>
        <button id="end-session-btn"
                style="background:rgba(255,255,255,0.15);color:#fff;border:none;font-weight:800;border-radius:20px;padding:0.3rem 0.9rem;cursor:pointer;font-family:'Nunito',sans-serif">
            <i class="bi bi-stop-circle mr-1"></i>End
        </button>
    </div>

    <!-- Progress bar -->
    <div class="kahoot-timer-bar">
        <div class="kahoot-timer-fill" id="progress-bar" style="width:0%"></div>
    </div>

    <!-- Feedback banner -->
    <div id="feedback-banner" class="kahoot-feedback"></div>

    <!-- Question -->
    <div class="kahoot-question-area">
        <p class="kahoot-question-text" id="question-text">Loading...</p>
    </div>

    <!-- 2×2 answer grid (filled by play.js) -->
    <div id="answers-container" class="kahoot-answers"></div>

</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"/>
<script th:src="@{/js/play.js}"></script>
</body>
</html>
