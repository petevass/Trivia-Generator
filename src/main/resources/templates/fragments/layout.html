<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle} + ' | TriviaGen'">TriviaGen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<nav th:fragment="navbar" class=" px-4 sticky top-0 z-50 shadow-xl" style="background:#1a0540;border-bottom:2px solid #4c2398;">
    <div class="max-w-screen-xl mx-auto flex items-center justify-between py-3 gap-4 flex-wrap">
        <a href="/" class="text-xl font-black text-white hover:text-purple-200 transition-colors flex items-center gap-1 shrink-0">
            <i class="bi bi-lightning-charge-fill" style="color:#a78bfa"></i>TriviaGen
        </a>
        <!-- Hamburger — mobile only -->
        <button class="text-purple-300 hover:text-white transition-colors p-1 md:hidden"
                onclick="document.getElementById('navMenu').classList.toggle('hidden')">
            <i class="bi bi-list text-2xl"></i>
        </button>
        <!-- Nav links -->
        <div id="navMenu" class="hidden md:flex flex-col md:flex-row md:items-center gap-1 w-full md:w-auto pb-3 md:pb-0">
            <a href="/" class="text-purple-200 hover:text-white hover:bg-white/10 px-3 py-2 rounded-lg font-bold transition-all text-sm">
                <i class="bi bi-house mr-1"></i>Home
            </a>
            <!-- Not logged in (auth.js toggles d-none) -->
            <div id="nav-auth-section" class="d-none flex items-center gap-2">
                <a href="/pages/login" class="text-sm font-bold text-white border-2 border-white/50 px-4 py-1.5 rounded-xl hover:bg-white hover:text-[#2d1265] transition-all">Login</a>
                <a href="/pages/login?tab=register" class="text-sm font-black bg-white text-[#2d1265] px-4 py-1.5 rounded-xl hover:bg-purple-100 transition-all shadow">Register</a>
            </div>
            <!-- Logged in (auth.js toggles d-none) -->
            <div id="nav-user-section" class="d-none flex flex-wrap items-center gap-1">
                <a href="/pages/leaderboard" class="text-purple-200 hover:text-white hover:bg-white/10 px-3 py-2 rounded-lg font-bold transition-all text-sm"><i class="bi bi-trophy mr-1"></i>Leaderboard</a>
                <a href="/pages/session/setup" class="text-purple-200 hover:text-white hover:bg-white/10 px-3 py-2 rounded-lg font-bold transition-all text-sm"><i class="bi bi-play-circle mr-1"></i>Play</a>
                <a href="/pages/profile" class="text-purple-200 hover:text-white hover:bg-white/10 px-3 py-2 rounded-lg font-bold transition-all text-sm"><i class="bi bi-person-circle mr-1"></i>Profile</a>
                <button onclick="logout()" class="text-sm font-bold text-red-400 border-2 border-red-400/50 px-3 py-1.5 rounded-xl hover:bg-red-500 hover:text-white hover:border-red-500 transition-all">
                    <i class="bi bi-box-arrow-right mr-1"></i>Logout
                </button>
            </div>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="mt-auto py-6 text-center font-bold text-sm" style="background:#1a0540;border-top:2px solid #4c2398;color:#c4b5fd;">
    <div class="max-w-6xl mx-auto px-4">
        <p><i class="bi bi-lightning-charge-fill mr-1" style="color:#a78bfa"></i>TriviaGen &copy; 2025</p>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script th:src="@{/js/auth.js}"></script>
</th:block>

</body>
</html>
