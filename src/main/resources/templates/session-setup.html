<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Setup Session')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-1">
<div class="max-w-xl mx-auto px-4 mt-12 mb-16">

    <div class="text-center mb-7">
        <h2 class="text-3xl font-black mb-2 text-white">Configure Your Session</h2>
        <p class="font-semibold" style="color:#c4b5fd">Choose your trivia settings and start playing</p>
    </div>

    <div class="rounded-2xl p-7 shadow-xl" style="background:#3a1578;border:1px solid #5d2dac">

        <div id="setup-error" class="alert-custom mb-5"></div>

        <form id="setup-form" novalidate>

            <!-- Category -->
            <div class="mb-6">
                <label for="category-select" class="block text-xs font-black uppercase tracking-wider mb-2" style="color:#c4b5fd">Category</label>
                <select id="category-select"
                        class="w-full text-white rounded-xl px-4 py-2.5 outline-none font-semibold cursor-pointer transition-colors"
                        style="background:#2d1265;border:2px solid #5d2dac"
                        onfocus="this.style.borderColor='#fff'" onblur="this.style.borderColor='#5d2dac'">
                    <option value="any">Any Category</option>
                    <option value="general knowledge">General Knowledge</option>
                    <option value="books">Books</option>
                    <option value="film">Film</option>
                    <option value="music">Music</option>
                    <option value="musicals and theaters">Musicals &amp; Theaters</option>
                    <option value="tv">Television</option>
                    <option value="video games">Video Games</option>
                    <option value="board games">Board Games</option>
                    <option value="science and nature">Science &amp; Nature</option>
                    <option value="science:computers">Science: Computers</option>
                    <option value="science:math">Science: Mathematics</option>
                    <option value="mythology">Mythology</option>
                    <option value="sports">Sports</option>
                    <option value="history">History</option>
                    <option value="geography">Geography</option>
                    <option value="politics">Politics</option>
                    <option value="art">Art</option>
                    <option value="celebrities">Celebrities</option>
                    <option value="animals">Animals</option>
                    <option value="vehicles">Vehicles</option>
                    <option value="comics">Comics</option>
                    <option value="gadgets">Gadgets</option>
                    <option value="anime and manga">Anime &amp; Manga</option>
                    <option value="cartoons and animation">Cartoons &amp; Animation</option>
                </select>
            </div>

            <!-- Difficulty -->
            <div class="mb-6">
                <label class="block text-xs font-black uppercase tracking-wider mb-3" style="color:#c4b5fd">Difficulty</label>
                <div>
                    <button type="button" class="option-btn selected" data-difficulty="any">Any</button>
                    <button type="button" class="option-btn" data-difficulty="easy">Easy</button>
                    <button type="button" class="option-btn" data-difficulty="medium">Medium</button>
                    <button type="button" class="option-btn" data-difficulty="hard">Hard</button>
                </div>
            </div>

            <!-- Question Type -->
            <div class="mb-6">
                <label class="block text-xs font-black uppercase tracking-wider mb-3" style="color:#c4b5fd">Question Type</label>
                <div>
                    <button type="button" class="option-btn selected" data-type="any">Any</button>
                    <button type="button" class="option-btn" data-type="multiple">Multiple Choice</button>
                    <button type="button" class="option-btn" data-type="boolean">True / False</button>
                </div>
            </div>

            <!-- Amount slider -->
            <div class="mb-8">
                <label for="amount-slider" class="block text-xs font-black uppercase tracking-wider mb-3" style="color:#c4b5fd">
                    Number of Questions:
                    <span id="amount-display" class="ml-1 text-white">10</span>
                </label>
                <input type="range" id="amount-slider" min="1" max="50" value="10"
                       class="w-full cursor-pointer" style="accent-color:#a78bfa"/>
                <div class="flex justify-between mt-1">
                    <span class="text-xs font-bold" style="color:#7c5fc0">1</span>
                    <span class="text-xs font-bold" style="color:#7c5fc0">50</span>
                </div>
            </div>

            <button type="submit" id="start-btn"
                    class="w-full font-black py-3 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2 text-lg active:scale-[0.98]"
                    style="background:#fff;color:#2d1265"
                    onmouseover="this.style.background='#e9d5ff'" onmouseout="this.style.background='#fff'">
                <i class="bi bi-play-fill"></i>Start Session
            </button>
        </form>
    </div>
</div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"/>
<script th:src="@{/js/setup.js}"></script>
</body>
</html>
