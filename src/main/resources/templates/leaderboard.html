<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Leaderboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-1">
<div class="max-w-6xl mx-auto px-4 mt-12 mb-16">

    <div class="text-center mb-10">
        <h2 class="text-3xl font-black mb-2 text-white">
            <i class="bi bi-trophy-fill text-yellow-300 mr-2"></i>Leaderboard
        </h2>
        <p class="font-semibold" style="color:#c4b5fd">Top 10 players ranked by performance</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

        <!-- Most Active -->
        <div class="rounded-2xl overflow-hidden" style="background:#3a1578;border:1px solid #5d2dac">
            <div class="px-5 py-3 font-bold flex items-center justify-between" style="background:rgba(76,35,152,0.5);border-bottom:1px solid #5d2dac">
                <span class="text-white"><i class="bi bi-activity mr-2" style="color:#a78bfa"></i>Most Active</span>
                <span class="text-xs font-normal" style="color:#7c5fc0">by total answered</span>
            </div>
            <div class="p-4 overflow-x-auto">
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player</th>
                            <th>Answered</th>
                            <th>Correct</th>
                        </tr>
                    </thead>
                    <tbody id="total-table">
                        <tr>
                            <td colspan="4" class="text-center py-6" style="color:#7c5fc0">
                                <div class="w-5 h-5 rounded-full animate-spin inline-block mr-2" style="border:2px solid #4c2398;border-top-color:#a78bfa"></div>
                                Loading...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Top Scorers -->
        <div class="rounded-2xl overflow-hidden" style="background:#3a1578;border:1px solid #5d2dac">
            <div class="px-5 py-3 font-bold flex items-center justify-between" style="background:rgba(76,35,152,0.5);border-bottom:1px solid #5d2dac">
                <span class="text-white"><i class="bi bi-star-fill text-yellow-300 mr-2"></i>Top Scorers</span>
                <span class="text-xs font-normal" style="color:#7c5fc0">by correct answers</span>
            </div>
            <div class="p-4 overflow-x-auto">
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player</th>
                            <th>Answered</th>
                            <th>Correct</th>
                        </tr>
                    </thead>
                    <tbody id="correct-table">
                        <tr>
                            <td colspan="4" class="text-center py-6" style="color:#7c5fc0">
                                <div class="w-5 h-5 rounded-full animate-spin inline-block mr-2" style="border:2px solid #4c2398;border-top-color:#a78bfa"></div>
                                Loading...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"/>
<script th:src="@{/js/leaderboard.js}"></script>
</body>
</html>
