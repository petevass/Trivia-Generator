<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profile')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-1">
<div class="max-w-2xl mx-auto px-4 mt-12 mb-16">

    <!-- Loading -->
    <div id="loading-section" class="text-center py-20">
        <div class="w-12 h-12 rounded-full animate-spin mx-auto mb-4" style="border:4px solid #4c2398;border-top-color:#a78bfa"></div>
        <p class="font-semibold" style="color:#c4b5fd">Loading profile...</p>
    </div>

    <!-- Profile content (shown by profile.js) -->
    <div id="profile-content" class="d-none">

        <!-- Avatar + Name -->
        <div class="text-center mb-10">
            <div class="w-20 h-20 rounded-full flex items-center justify-center text-3xl font-black text-white mx-auto mb-4"
                 style="background:linear-gradient(135deg,#7c3aed,#a855f7)"
                 id="user-avatar">??</div>
            <h2 class="text-3xl font-black mb-2 text-white" id="user-name">Player</h2>
            <span class="inline-flex items-center gap-1 text-xs font-bold px-3 py-1 rounded-full"
                  style="color:#a78bfa;border:1px solid rgba(167,139,250,0.4);background:rgba(167,139,250,0.1)">
                <i class="bi bi-person-check"></i>Player
            </span>
        </div>

        <!-- Stats grid -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="rounded-2xl p-5 text-center transition-all hover:-translate-y-1"
                 style="background:#3a1578;border:1px solid #5d2dac"
                 onmouseover="this.style.borderColor='#a78bfa'" onmouseout="this.style.borderColor='#5d2dac'">
                <div class="text-4xl font-black mb-1" style="color:#a78bfa" id="total-answered">0</div>
                <div class="text-xs uppercase tracking-wider font-bold" style="color:#7c5fc0">Answered</div>
            </div>
            <div class="rounded-2xl p-5 text-center transition-all hover:-translate-y-1"
                 style="background:#3a1578;border:1px solid #5d2dac"
                 onmouseover="this.style.borderColor='#34d399'" onmouseout="this.style.borderColor='#5d2dac'">
                <div class="text-4xl font-black mb-1 text-emerald-400" id="total-correct">0</div>
                <div class="text-xs uppercase tracking-wider font-bold" style="color:#7c5fc0">Correct</div>
            </div>
            <div class="rounded-2xl p-5 text-center transition-all hover:-translate-y-1"
                 style="background:#3a1578;border:1px solid #5d2dac"
                 onmouseover="this.style.borderColor='#f87171'" onmouseout="this.style.borderColor='#5d2dac'">
                <div class="text-4xl font-black mb-1 text-red-400" id="total-wrong">0</div>
                <div class="text-xs uppercase tracking-wider font-bold" style="color:#7c5fc0">Wrong</div>
            </div>
            <div class="rounded-2xl p-5 text-center transition-all hover:-translate-y-1"
                 style="background:#3a1578;border:1px solid #5d2dac"
                 onmouseover="this.style.borderColor='#fde047'" onmouseout="this.style.borderColor='#5d2dac'">
                <div class="text-4xl font-black mb-1 text-yellow-300" id="accuracy">0%</div>
                <div class="text-xs uppercase tracking-wider font-bold" style="color:#7c5fc0">Accuracy</div>
            </div>
        </div>

        <!-- Accuracy bar -->
        <div class="rounded-2xl p-6 mb-6" style="background:#3a1578;border:1px solid #5d2dac">
            <p class="text-xs font-black uppercase tracking-wider mb-3" style="color:#c4b5fd">Accuracy</p>
            <div class="w-full rounded-full overflow-hidden mb-2" style="height:0.75rem;background:#2d1265">
                <div class="h-full rounded-full transition-all duration-500"
                     style="background:linear-gradient(90deg,#7c3aed,#a855f7);width:0%"
                     id="accuracy-bar"></div>
            </div>
            <div class="flex justify-between">
                <span class="text-xs font-bold" style="color:#7c5fc0">0%</span>
                <span class="text-xs font-bold" style="color:#a78bfa" id="accuracy-label">0%</span>
                <span class="text-xs font-bold" style="color:#7c5fc0">100%</span>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex flex-wrap justify-center gap-3">
            <a href="/pages/session/setup"
               class="inline-flex items-center gap-2 font-black px-6 py-3 rounded-xl transition-all shadow-lg hover:-translate-y-0.5"
               style="background:#fff;color:#2d1265"
               onmouseover="this.style.background='#e9d5ff'" onmouseout="this.style.background='#fff'">
                <i class="bi bi-play-fill"></i>Play Trivia
            </a>
            <a href="/pages/leaderboard"
               class="inline-flex items-center gap-2 border-2 border-white/40 text-white hover:bg-white/15 font-bold px-6 py-3 rounded-xl transition-all">
                <i class="bi bi-trophy"></i>Leaderboard
            </a>
            <button onclick="logout()"
                    class="inline-flex items-center gap-2 border-2 border-red-400/50 text-red-400 hover:bg-red-500 hover:text-white hover:border-red-500 font-bold px-6 py-3 rounded-xl transition-all">
                <i class="bi bi-box-arrow-right"></i>Logout
            </button>
        </div>

    </div>
</div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"/>
<script th:src="@{/js/profile.js}"></script>
</body>
</html>
